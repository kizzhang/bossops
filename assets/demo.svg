pan></text><text x="56" y="488" xml:space="preserve"><tspan fill="#6E7681" font-weight="400">   ⋯ 随机等待 27 s</tspan></text><text x="56" y="522" xml:space="preserve"><tspan fill="#9BC59D" font-weight="700">●</tspan><tspan fill="#E6E4DE" font-weight="600">  王先生  </tspan><tspan fill="#6E7681" font-weight="400">公司 ✓ 期望 ✓  粘贴 → 复核 → 发送</tspan><tspan x="720" fill="#9BC59D" font-weight="400">回执 02.png</tspan></text><text x="56" y="556" xml:space="preserve"><tspan fill="#6E7681" font-weight="400">   ⋯ 随机等待 18 s</tspan></text><text x="56" y="590" xml:space="preserve"><tspan fill="#E3B66B" font-weight="700">▲</tspan><tspan fill="#E3B66B" font-weight="600">  出现「安全验证」，已停手。</tspan><tspan fill="#E6E4DE" font-weight="400">请你本人完成验证。</tspan></text><text x="56" y="624" xml:space="preserve"><tspan fill="#6E7681" font-weight="400">   今天剩余操作转为只读；待发 3 条已整理到 </tspan><tspan fill="#9BC59D" font-weight="500">queue.md</tspan></text>
